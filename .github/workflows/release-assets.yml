# .github/workflows/release-assets.yml
# Builds and uploads release binaries with standard Rust target triple naming.
# This naming convention enables automatic discovery by cargo-binstall.
name: Build & Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build binaries for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          - target: x86_64-pc-windows-msvc
            os: windows-latest

          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BIN="target/${{ matrix.target }}/release/toolkitrs"
          [[ "${{ matrix.target }}" == *windows* ]] && BIN="$BIN.exe"

          # Standard naming: {crate}-{version}-{target}.{ext}
          ARTIFACT="toolkitrs-${VERSION}-${{ matrix.target }}"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${ARTIFACT}.zip" "$BIN"
          else
            tar czf "${ARTIFACT}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi

      - uses: actions/upload-artifact@v4
        with:
          # Use unique artifact names per target to avoid collisions
          name: toolkitrs-${{ github.ref_name }}-${{ matrix.target }}
          path: toolkitrs-*.*

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: toolkitrs-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            toolkitrs-*.tar.gz
            toolkitrs-*.zip
          generate_release_notes: true
