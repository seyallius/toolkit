# .github/workflows/release-assets.yml
# Builds and uploads release binaries with standard Rust target triple naming.
# This naming convention enables automatic discovery by cargo-binstall.
name: Build & Release Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    uses: seyallius/github-workflows/.github/workflows/build-binaries.yml@v1
    with:
      binary_name: toolkitrs
